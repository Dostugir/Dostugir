<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0% { transform: translate(0, 0); }
        25% { transform: translate(120px, -80px); }
        50% { transform: translate(80px, -120px); }
        75% { transform: translate(-80px, -60px); }
        100% { transform: translate(0, 0); }
      }
      
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2deg); }
      }
      
      @keyframes breath {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.05); }
      }
      
      @keyframes blink {
        0%, 90%, 100% { height: 12px; }
        95% { height: 2px; }
      }
      
      @keyframes wave {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(30deg); }
        100% { transform: rotate(0deg); }
      }
      
      .character {
        animation: float 10s infinite ease-in-out;
      }
      
      .torso {
        animation: breath 3s infinite ease-in-out;
        transform-origin: center;
      }
      
      .left-arm {
        transform-origin: 340px 180px;
        animation: sway 4s infinite ease-in-out;
      }
      
      .right-arm {
        animation: wave 2s infinite ease-in-out;
        transform-origin: 460px 180px;
      }
      
      .text-label {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #36BCF7;
        font-weight: bold;
        text-anchor: middle;
      }
    </style>
    
    <!-- Skin gradient -->
    <radialGradient id="skinTone" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:0.9" />
    </radialGradient>
    
    <!-- Hair gradient -->
    <linearGradient id="hairColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Eye gradient -->
    <radialGradient id="eyeColor" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#36BCF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5f7a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Clothing gradient -->
    <linearGradient id="shirtColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#36BCF7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F3A66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main character group -->
  <g class="character">
    
    <!-- Hair -->
    <ellipse cx="400" cy="120" rx="48" ry="52" fill="url(#hairColor)"/>
    <path d="M 352 140 Q 340 130 335 145 Q 338 155 352 150 Z" fill="url(#hairColor)"/>
    <path d="M 448 140 Q 460 130 465 145 Q 462 155 448 150 Z" fill="url(#hairColor)"/>
    
    <!-- Head -->
    <circle cx="400" cy="140" r="45" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5"/>
    
    <!-- Left ear -->
    <ellipse cx="355" cy="140" rx="12" ry="20" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1"/>
    
    <!-- Right ear -->
    <ellipse cx="445" cy="140" rx="12" ry="20" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1"/>
    
    <!-- Left eye white -->
    <ellipse cx="380" cy="130" rx="10" ry="14" fill="#FFFFFF"/>
    <!-- Left eye iris -->
    <circle cx="382" cy="135" r="8" fill="url(#eyeColor)"/>
    <!-- Left pupil -->
    <circle cx="383" cy="136" r="5" fill="#000000"/>
    <!-- Left eye shine -->
    <circle cx="385" cy="133" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Right eye white -->
    <ellipse cx="420" cy="130" rx="10" ry="14" fill="#FFFFFF"/>
    <!-- Right eye iris -->
    <circle cx="418" cy="135" r="8" fill="url(#eyeColor)"/>
    <!-- Right pupil -->
    <circle cx="417" cy="136" r="5" fill="#000000"/>
    <!-- Right eye shine -->
    <circle cx="415" cy="133" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Eyebrows -->
    <path d="M 370 115 Q 380 110 390 115" stroke="#2d2d2d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 410 115 Q 420 110 430 115" stroke="#2d2d2d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Nose -->
    <path d="M 400 130 L 398 155" stroke="#D2691E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="395" cy="158" r="3" fill="#D2691E"/>
    <circle cx="405" cy="158" r="3" fill="#D2691E"/>
    
    <!-- Mouth (smile) -->
    <path d="M 385 165 Q 400 175 415 165" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 385 165 Q 400 173 415 165" fill="#F4A460" opacity="0.6"/>
    
    <!-- Neck -->
    <rect x="385" y="180" width="30" height="15" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1"/>
    
    <!-- Torso (shirt) -->
    <g class="torso">
      <ellipse cx="400" cy="230" rx="50" ry="55" fill="url(#shirtColor)" stroke="#0F3A66" stroke-width="2"/>
      
      <!-- Shirt collar -->
      <path d="M 385 195 L 375 210 L 400 200 L 425 210 L 415 195" fill="#36BCF7" stroke="#0F3A66" stroke-width="1.5"/>
      
      <!-- Chest accent -->
      <circle cx="400" cy="215" r="8" fill="#36BCF7" stroke="#0F3A66" stroke-width="1" opacity="0.7"/>
      <circle cx="400" cy="215" r="5" fill="#00FF00" opacity="0.6"/>
    </g>
    
    <!-- Left arm -->
    <g class="left-arm">
      <ellipse cx="350" cy="210" rx="16" ry="45" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5" transform="rotate(-20 350 210)"/>
      <!-- Left hand -->
      <circle cx="330" cy="255" r="14" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5"/>
      <circle cx="322" cy="250" r="4" fill="url(#skinTone)"/>
      <circle cx="320" cy="258" r="4" fill="url(#skinTone)"/>
      <circle cx="324" cy="267" r="4" fill="url(#skinTone)"/>
    </g>
    
    <!-- Right arm (waving) -->
    <g class="right-arm">
      <ellipse cx="450" cy="210" rx="16" ry="45" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5" transform="rotate(20 450 210)"/>
      <!-- Right hand -->
      <circle cx="470" cy="255" r="14" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5"/>
      <circle cx="478" cy="250" r="4" fill="url(#skinTone)"/>
      <circle cx="480" cy="258" r="4" fill="url(#skinTone)"/>
      <circle cx="476" cy="267" r="4" fill="url(#skinTone)"/>
    </g>
    
    <!-- Left leg -->
    <ellipse cx="380" cy="310" rx="14" ry="38" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5"/>
    <!-- Left foot -->
    <ellipse cx="375" cy="348" rx="18" ry="12" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Right leg -->
    <ellipse cx="420" cy="310" rx="14" ry="38" fill="url(#skinTone)" stroke="#D2691E" stroke-width="1.5"/>
    <!-- Right foot -->
    <ellipse cx="425" cy="348" rx="18" ry="12" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="1.5"/>
    
  </g>
  
  <!-- Status text -->
  <text class="text-label" x="400" y="420">🤖 AI Engineer Active</text>
  <text class="text-label" x="400" y="450" style="font-size: 12px; fill: #8B5CF6;">Building intelligent systems...</text>
  
  <!-- Floating particles around character -->
  <circle cx="300" cy="120" r="3" fill="#36BCF7" opacity="0.4">
    <animate attributeName="cy" values="120;80;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="200" r="2.5" fill="#36BCF7" opacity="0.4">
    <animate attributeName="cy" values="200;240;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="300" r="2" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="cy" values="300;270;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>
  
</svg>