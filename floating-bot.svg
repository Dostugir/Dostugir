<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Detailed anime AI engineer character</title>
  <desc id="desc">A floating anime-style character with silver-blue hair, expressive eyes, a futuristic jacket, and glowing holographic effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152c"/><stop offset=".5" stop-color="#101d46"/><stop offset="1" stop-color="#24133e"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#36bcf7" stop-opacity=".55"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset=".38" stop-color="#9bdcff"/><stop offset="1" stop-color="#5274c8"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1ed"/><stop offset="1" stop-color="#e9a6a9"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b87"/><stop offset=".55" stop-color="#151c50"/><stop offset="1" stop-color="#090d2d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8ffff"/><stop offset=".45" stop-color="#36bcf7"/><stop offset="1" stop-color="#866bff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      @keyframes drift {0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(0,-24px) rotate(1deg)}}
      @keyframes hairSway {0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
      @keyframes blink {0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
      @keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes spin {to{transform:rotate(360deg)}}
      .hero{animation:drift 8s ease-in-out infinite;transform-origin:450px 350px}
      .hair{animation:hairSway 5s ease-in-out infinite;transform-origin:450px 205px}
      .blink{animation:blink 4.5s infinite;transform-origin:center}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .orbit{animation:spin 18s linear infinite;transform-origin:450px 320px}
      .label{font:700 18px 'Fira Code',monospace;letter-spacing:2px;text-anchor:middle}
    </style>
  </defs>

  <rect width="900" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="450" cy="300" r="260" fill="url(#halo)" filter="url(#soft)"/>
  <g opacity=".35" fill="#9beaff"><circle cx="120" cy="150" r="2"/><circle cx="770" cy="180" r="3"/><circle cx="150" cy="500" r="3"/><circle cx="760" cy="530" r="2"/></g>

  <g class="orbit" fill="none" stroke="#36bcf7" stroke-opacity=".28">
    <ellipse cx="450" cy="320" rx="290" ry="105" stroke-width="2" stroke-dasharray="8 18"/>
    <ellipse cx="450" cy="320" rx="220" ry="75" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 12"/>
    <circle cx="740" cy="320" r="7" fill="#36bcf7" filter="url(#glow)"/>
  </g>

  <g class="hero">
    <!-- flowing hair behind the head -->
    <path class="hair" d="M330 220 Q285 275 310 390 Q328 355 354 335 Q325 430 370 386 L397 326 L430 365 L458 315 L490 370 Q530 415 555 350 Q570 410 600 365 Q615 265 555 210Z" fill="url(#hair)" stroke="#30488f" stroke-width="5"/>
    <path d="M337 228 Q308 310 338 345 M548 225 Q585 300 553 355 M383 236 Q365 315 390 350 M505 230 Q530 300 512 350" fill="none" stroke="#d8f6ff" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/>

    <!-- neck and shoulders -->
    <path d="M408 315 L408 370 Q450 395 492 370 L492 315" fill="url(#skin)" stroke="#bc707e" stroke-width="3"/>
    <path d="M335 405 Q355 350 408 350 L450 385 L492 350 Q548 355 575 405 L625 570 Q450 635 275 570Z" fill="url(#jacket)" stroke="#526ad5" stroke-width="5"/>
    <!-- jacket panels and luminous trim -->
    <path d="M408 370 L450 405 L492 370 M450 405 L450 585 M340 415 L390 505 L350 575 M560 415 L510 505 L550 575" fill="none" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M365 405 L405 450 L385 478 L350 430 M535 405 L495 450 L515 478 L550 430" fill="#324ba1" stroke="#7c8dff" stroke-width="3"/>
    <path d="M420 465 L480 465 L492 530 L408 530Z" fill="#0a1238" stroke="#36bcf7" stroke-width="3"/>
    <text x="450" y="505" fill="#b8ffff" class="label" font-size="13">AI</text>

    <!-- left arm and hand -->
    <path d="M340 415 Q285 435 265 500 L235 545 Q225 565 242 578 Q258 587 270 565 L320 505 L365 455Z" fill="url(#jacket)" stroke="#526ad5" stroke-width="5"/>
    <path d="M236 545 Q216 554 220 577 Q226 602 248 597 L270 573 Q274 548 250 542Z" fill="url(#skin)" stroke="#bc707e" stroke-width="3"/>
    <path d="M229 572 l-14 15 M240 578 l-9 18 M251 577 l-3 17" stroke="#d88791" stroke-width="4" stroke-linecap="round"/>

    <!-- right raised arm and hand -->
    <path d="M560 415 Q620 390 638 330 L650 270 Q655 250 674 255 Q690 261 684 285 L670 380 Q660 438 590 490Z" fill="url(#jacket)" stroke="#526ad5" stroke-width="5"/>
    <path d="M650 275 Q645 245 655 218 L663 185 Q668 170 679 174 Q688 178 685 195 L681 217 L691 180 Q696 166 707 171 Q714 176 709 193 L700 222 L713 190 Q719 178 729 184 Q735 190 729 203 L714 240 Q704 270 680 285Z" fill="url(#skin)" stroke="#bc707e" stroke-width="3"/>
    <path d="M666 220 L684 226 M681 217 L700 222 M696 214 L713 220" stroke="#d88791" stroke-width="3"/>

    <!-- face -->
    <path d="M350 185 Q355 135 450 125 Q545 135 550 185 L530 285 Q505 345 450 355 Q395 345 370 285Z" fill="url(#skin)" stroke="#bc707e" stroke-width="4"/>
    <!-- fringe -->
    <path class="hair" d="M340 205 Q330 125 405 105 Q490 80 550 160 L540 220 L505 178 Q510 220 475 245 L460 165 Q440 220 395 245 L400 170 Q370 210 340 205Z" fill="url(#hair)" stroke="#30488f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M390 130 Q410 108 440 110 M445 110 Q480 105 512 135" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="8" stroke-linecap="round"/>

    <!-- expressive anime eyes -->
    <path d="M370 245 Q400 215 430 245 Q400 277 370 245Z" fill="#fff" stroke="#38275f" stroke-width="5"/>
    <path d="M470 245 Q500 215 530 245 Q500 277 470 245Z" fill="#fff" stroke="#38275f" stroke-width="5"/>
    <g class="blink">
      <ellipse cx="400" cy="248" rx="12" ry="19" fill="url(#cyan)" stroke="#182b73" stroke-width="3"/><ellipse cx="500" cy="248" rx="12" ry="19" fill="url(#cyan)" stroke="#182b73" stroke-width="3"/>
      <circle cx="402" cy="251" r="6" fill="#101331"/><circle cx="502" cy="251" r="6" fill="#101331"/>
      <circle cx="405" cy="242" r="4" fill="#fff"/><circle cx="505" cy="242" r="4" fill="#fff"/>
    </g>
    <path d="M365 220 Q400 195 433 218 M467 218 Q500 195 535 220" fill="none" stroke="#39285d" stroke-width="7" stroke-linecap="round"/>
    <path d="M450 245 L442 285 L454 290" fill="none" stroke="#c47a83" stroke-width="3" stroke-linecap="round"/>
    <path d="M420 307 Q450 330 480 307" fill="#bd526f" stroke="#7d345d" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 311 Q450 318 470 311" stroke="#ffd7dc" stroke-width="4" stroke-linecap="round"/>
    <circle class="pulse" cx="365" cy="285" r="9" fill="#ef8297" opacity=".45"/><circle class="pulse" cx="535" cy="285" r="9" fill="#ef8297" opacity=".45"/>
  </g>

  <!-- holographic particles -->
  <g class="pulse" fill="#36bcf7" filter="url(#glow)"><path d="M150 330 l8 14 16 3-12 11 3 16-15-8-15 8 3-16-12-11 16-3z"/><path d="M735 430 l6 11 12 2-9 8 2 12-11-6-11 6 2-12-9-8 12-2z"/></g>
  <text x="450" y="665" fill="#b8ffff" class="label">✦ AI ENGINEER ONLINE ✦</text>
</svg>